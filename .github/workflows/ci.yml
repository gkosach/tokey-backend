name: CI/CD Pipeline

on:
  push:
    branches: [main, testnet]
    paths:
      - "prisma/schema.prisma"
      - "src/**"
      - "tests/**"
  pull_request:
    branches: [main, testnet]

jobs:
  merge-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch rules
        run: |
          SOURCE="${{ github.head_ref }}"
          TARGET="${{ github.base_ref }}"

          if [[ "$TARGET" == "main" && ! "$SOURCE" =~ ^(german|nikita)$ ]]; then
            echo "❌ Only german/nikita branches can merge to main!"
            exit 1
          fi

          if [[ "$TARGET" =~ ^(testnet|production)$ && "$SOURCE" != "main" ]]; then
            echo "❌ Only main can merge to $TARGET!"
            exit 1
          fi

          echo "✅ Merge allowed: $SOURCE → $TARGET"

  test:
    needs: merge-rules
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: test
      CI: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - run: npm ci
      - run: npm run test:badges
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: coverage/

  publish-types:
    if: github.event_name == 'push' && contains(github.event.head_commit.modified, 'prisma/schema.prisma')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - run: npm run generate:frontend-types
      - run: cd types && npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-badges:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run test:badges
      - run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add assets/coverage/
          git commit -m "📊 Update coverage badges [skip ci]" || echo "No changes to commit"
          git push

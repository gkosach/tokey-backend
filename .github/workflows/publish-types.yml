name: Publish Types

on:
  push:
    branches: [main]
    paths:
      - 'prisma/schema.prisma'  # Триггер только при изменении схемы

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Полная история коммитов

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Generate types
        run: npm run generate  # Используем новый скрипт

      - name: Publish package
        run: |
          cd types
          npm version patch -m "chore: auto-bump version [skip ci]"
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish Types

on:
  push:
    branches: [main]
    paths:
      - "prisma/schema.prisma"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Получаем полную историю коммитов

      - name: Verify schema changes
        id: check-changes
        run: |
          # Проверяем, что были изменения именно в schema.prisma
          git diff --name-only HEAD^ HEAD | grep -q 'prisma/schema.prisma' || {
            echo "::warning::No changes in schema.prisma detected"
            echo "should_publish=false" >> $GITHUB_OUTPUT
            exit 0
          }
          echo "should_publish=true" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check-changes.outputs.should_publish == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        if: steps.check-changes.outputs.should_publish == 'true'
        run: |
          npm ci
          cd types && npm ci

      - name: Bump version and build
        if: steps.check-changes.outputs.should_publish == 'true'
        run: |
          cd types
          # Увеличиваем версию и создаем тег
          npm version patch -m "chore(release): auto-bump to %s [skip ci]"
          # Собираем пакет
          npm run build
          # Фиксируем изменения версии
          git add package.json package-lock.json dist
          git commit --amend --no-edit
          git push origin main --follow-tags

      - name: Publish package
        if: steps.check-changes.outputs.should_publish == 'true'
        run: |
          cd types
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          npm publish --access public

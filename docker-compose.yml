version: "3.9"

services:
  back-app:
    container_name: sona_back_app
    build:
      context: .
      args:
        - NODE_ENV=production
    environment:
      - NODE_ENV=production
    env_file: .production.env
    command: sh -c "npm run build && npm run start:prod"
    networks:
      - site
    restart: unless-stopped


networks:
  site:
    driver: bridge
    external: true

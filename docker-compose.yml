services:
  back-app:
    container_name: back-app
    build:
      context: .
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./assets:/app/assets
      - ./.env:/app/.env
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./nodemon.json:/app/nodemon.json
      # НЕ монтируем node_modules!
    working_dir: /app
    command: sh -c "npm install && npx prisma generate && npm run start"
    networks:
      - site
    depends_on:
      - db
    restart: "no" # Отключаем автоперезапуск для разработки
    ports:
      - "3002:3002"

  db:
    container_name: postgres-db
    image: postgres:14-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - site
    restart: "no"

networks:
  site:
    driver: bridge

volumes:
  postgres_data:
